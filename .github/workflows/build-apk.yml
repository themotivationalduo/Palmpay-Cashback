name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permissions for Gradle
        run: |
          chmod +x ./android/gradlew || true

      - name: Build Debug Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Built APK File
        run: |
          echo "Locating generated APK..."
          find ./android/app/build/outputs/apk -name "*.apk"
          mkdir -p ./build-output
          cp ./android/app/build/outputs/apk/debug/app-debug.apk ./build-output/PalmPay-CashBack-v1.0.0.apk || cp $(find ./android/app/build/outputs/apk -name "*.apk" | head -n 1) ./build-output/PalmPay-CashBack-v1.0.0.apk

      - name: Upload APK Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PalmPay-CashBack-Android-APK
          path: ./build-output/*.apk
          retention-days: 30
